Lbl:'available',nextLbl:'next',dashComTitle:'commissions',addTitle:'add',clientLbl:'client',serviceLbl:'service',amountLbl:'amount',currencySaleLbl:'currency',registerBtn:'register',catalogNote:'catalogNote',mySalesTitle:'mySales',paymentsTitle:'payments'};Object.entries(ids).forEach(([id,key])=>setText(id,key));document.querySelectorAll('[data-rate]').forEach(el=>{const key=el.dataset.rate;const span=el.querySelector('span');if(span)span.textContent=tr(key)});renderCatalog();if(!E('dashboard').classList.contains('hidden'))loadDashboard()}function changeLang(lang){currentLang=lang;localStorage.setItem(LANG_KEY,lang);applyLang()}function renderCatalog(){const sel=E('serviceSelect');if(!sel)return;const old=sel.value;sel.innerHTML='<option value="">'+esc(tr('choose'))+'</option>'+CATALOG.map(x=>'<option value="'+x.id+'">'+esc(x.names[currentLang]||x.names.pt)+'</option>').join('');if([...sel.options].some(o=>o.value===old))sel.value=old;toggleOther()}function toggleOther(){const isOther=E('serviceSelect')?.value==='other';E('otherWrap')?.classList.toggle('hidden',!isOther);setText('otherLbl','otherName')}function msg(id,t,ok=true){E(id).innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}function statusLabel(s){return tr('statuses')[s]||s}function showAuth(){E('landing').classList.remove('hidden');E('dashboard').classList.add('hidden')}function showDash(){E('landing').classList.add('hidden');E('dashboard').classList.remove('hidden')}function token(){return localStorage.getItem(TOKEN_KEY)||''}async function signup(){const {data,error}=await db.rpc('ldr_simple_seller_signup',{p_name:E('suName').value.trim(),p_email:E('suEmail').value.trim(),p_password:E('suPass').value,p_phone:E('suPhone').value.trim(),p_country:E('suCountry').value.trim(),p_currency:E('suCurrency').value});if(error)return msg('authMsg',error.message,false);localStorage.setItem(TOKEN_KEY,data.token);await loadDashboard()}async function login(){const {data,error}=await db.rpc('ldr_simple_seller_login',{p_email:E('liEmail').value.trim(),p_password:E('liPass').value});if(error)return msg('authMsg',error.message,false);localStorage.setItem(TOKEN_KEY,data.token);await loadDashboard()}function logout(){localStorage.removeItem(TOKEN_KEY);location.reload()}async function loadDashboard(){if(!token())return showAuth();const {data,error}=await db.rpc('ldr_simple_seller_dashboard',{p_token:token()});if(error){localStorage.removeItem(TOKEN_KEY);showAuth();return msg('authMsg',tr('relog'),false)}showDash();E('sellerName').textContent=data.seller.full_name;E('sellerEmail').textContent=data.seller.email;E('nextPay').textContent=new Date(data.next_payment_date+'T12:00:00').toLocaleDateString(currentLang==='pt'?'pt-BR':currentLang==='fr'?'fr-FR':currentLang==='es'?'es-ES':'en-US');E('available').textContent=money(data.available_eur,'EUR')+' / '+money(data.available_brl,'BRL');E('salesCount').textContent=(data.sales||[]).length;E('pendingCount').textContent=(data.sales||[]).filter(x=>['pending','confirmed'].includes(x.status)).length;E('salesList').innerHTML=(data.sales||[]).map(x=>`<div class="item"><b>${esc(x.customer_name)}</b> — ${esc(x.service_name)}<br><span class="small">${tr('saleLabel')}: ${money(x.amount_cents,x.currency)} · ${tr('commissionLabel')} ${x.commission_rate}% = ${money(x.commission_cents,x.currency)} · <span class="badge ${x.status}">${statusLabel(x.status)}</span></span></div>`).join('')||'<p class="small">'+esc(tr('noneSales'))+'</p>';E('payoutList').innerHTML=(data.payouts||[]).map(x=>`<div class="item"><b>${money(x.amount_cents,x.currency)}</b> — ${tr('paidOn')} ${new Date(x.paid_at).toLocaleDateString(currentLang==='pt'?'pt-BR':currentLang==='fr'?'fr-FR':currentLang==='es'?'es-ES':'en-US')}<br><span class="small">${tr('reference')}: ${esc(x.payment_reference||tr('manual'))}</span></div>`).join('')||'<p class="small">'+esc(tr('nonePay'))+'</p>'}E('serviceSelect').addEventListener('change',toggleOther);E('saleForm').addEventListener('submit',async e=>{e.preventDefault();const item=CATALOG.find(x=>x.id===E('serviceSelect').value);if(!item)return msg('saleMsg',tr('chooseErr'),false);let serviceName=item.names[currentLang]||item.names.pt;if(item.id==='other'){serviceName=E('otherService').value.trim();if(!serviceName)return msg('saleMsg',tr('otherErr'),false)}const {error}=await db.rpc('ldr_simple_create_sale',{p_token:token(),p_customer_name:E('customer').value.trim(),p_service_name:serviceName,p_amount:Number(E('amount').value),p_currency:E('currency').value,p_category:item.cat});if(error)return msg('saleMsg',error.message,false);e.target.reset();renderCatalog();msg('saleMsg',tr('saleOk'));await loadDashboard()});window.signup=signup;window.login=login;window.logout=logout;window.changeLang=changeLang;applyLang();loadDashboard();</script></body></html>
