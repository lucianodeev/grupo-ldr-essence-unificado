name: Apply LDR Commercial Academy
on:
  push:
    paths:
      - 'tools/patch_academy_portals.py'
      - '.github/workflows/apply-academy-portals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply portal patches
        run: python tools/patch_academy_portals.py
      - name: Validate seller JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['rede-comercial-final/vendedor.html','rede-comercial-final/admin.html','rede-comercial-final/academia-vendas.html']:
              s=Path(f).read_text(encoding='utf-8')
              js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
              Path('/tmp/'+Path(f).stem+'.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/vendedor.js
          node --check /tmp/admin.js
          node --check /tmp/academia-vendas.js
      - name: Validate diff
        run: git diff --check
      - name: Commit and publish
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add rede-comercial-final/vendedor.html rede-comercial-final/admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: connect Commercial Academy to seller and admin portals"
          git push origin HEAD:main
