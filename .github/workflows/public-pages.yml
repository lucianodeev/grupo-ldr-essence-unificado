name: Publish Public Pages

on:
  push:
    branches: [main]
    paths:
      - 'rede-comercial-final/**'
      - 'gisele-moura-viagens/**'
      - '.github/workflows/public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp -R rede-comercial-final/. _site/
          cp rede-comercial-final/vendedor.html _site/index.html
          mkdir -p _site/gisele-moura-viagens
          cp -R gisele-moura-viagens/. _site/gisele-moura-viagens/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# GitHub Pages source enabled on 2026-09-03.
# Includes the seller portal and the Gisele Moura travel landing page.
