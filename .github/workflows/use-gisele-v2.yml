name: Use Gisele V2 Photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-gisele-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Point page to valid JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gisele-moura-viagens/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('gisele-moura.jpg?v=20260908a','gisele-moura-v2.jpg?v=20260908b')
          s = s.replace('assets/gisele-moura.jpg','assets/gisele-moura-v2.jpg')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gisele-moura-viagens/index.html
          git diff --cached --quiet || git commit -m "Use valid Gisele photo asset"
          git push
