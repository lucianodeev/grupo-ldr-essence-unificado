name: Add seller recurring plans

on:
  push:
    paths:
      - '.github/scripts/patch_seller_recurring.py'
      - '.github/workflows/add-seller-recurring-plans.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply seller plans patch
        run: python .github/scripts/patch_seller_recurring.py
      - name: Validate JavaScript
        run: node --check /tmp/vendor.js
      - name: Validate diff
        run: git diff --check
      - name: Commit seller portal
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add rede-comercial-final/vendedor.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add company and professional plans to seller dashboard"
          git push origin HEAD:main
