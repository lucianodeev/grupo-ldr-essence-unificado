name: Add seller onboarding

on:
  push:
    paths:
      - '.github/scripts/add_seller_onboarding.py'
      - '.github/workflows/add-seller-onboarding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate onboarding and patch seller portal
        run: python .github/scripts/add_seller_onboarding.py
      - name: Validate presentation HTML JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['rede-comercial-final/vendedor.html','rede-comercial-final/apresentacao-vendedores.html']:
              s=Path(name).read_text(encoding='utf-8')
              js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
              out='/tmp/'+Path(name).stem+'.js'
              Path(out).write_text(js,encoding='utf-8')
              print(out)
          PY
          node --check /tmp/vendedor.js
          node --check /tmp/apresentacao-vendedores.js
      - name: Validate diff
        run: git diff --check
      - name: Commit seller onboarding
        shell: bash
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add rede-comercial-final/vendedor.html rede-comercial-final/apresentacao-vendedores.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add seller interview presentation and onboarding"
          git push origin HEAD:main
